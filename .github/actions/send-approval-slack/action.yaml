name: "Slack Approval Message"
description: "Sends Slack Approve/Reject interactive message"

inputs:
  slack_token:
    description: "Slack bot token"
    required: true
  channel_id:
    description: "Slack channel ID"
    required: true
  repository:
    description: "Repository name"
    required: true
  image_tag:
    description: "Docker image tag"
    required: true
  environment:
    description: "Environment name"
    required: true
  region:
    description: "AWS region"
    required: true

runs:
  using: "node20"
  main: "index.js"
